# XcodeGen spec — the .xcodeproj is generated from this (`xcodegen generate`) and not committed.
# ${VARS} are read from the environment at generation time; CI sets them from GitHub
# repository variables (.github/workflows/ios.yml).
name: VictoryAI
include:
  - path: widgets.yml
    enable: ${ENABLE_LIVE_ACTIVITIES}
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.5.7
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0

targets:
  VictoryAI:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: VictoryAI
        excludes:
          - PrivacyInfo.xcprivacy
      - path: VictoryAI/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: RevenueCat
        product: RevenueCat
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Victory AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        BACKEND_URL: $(BACKEND_URL)
        WEB_APP_URL: $(WEB_APP_URL)
        CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(PRODUCT_BUNDLE_IDENTIFIER)]
        NSCameraUsageDescription: Victory AI uses the camera to count your punches live during a round (on your phone — nothing is uploaded) and, only if you turn on recording, to record rounds for AI scoring.
        NSMicrophoneUsageDescription: Your session videos include audio so the AI can analyse rhythm and breathing.
        NSPhotoLibraryUsageDescription: Choose an existing training video to analyse instead of recording a new one.
        NSPhotoLibraryAddUsageDescription: Save your scorecard image to your photo library.
        NSMotionUsageDescription: Live Coach uses your AirPods' motion sensors to count head movement — slips, rolls and pulls — during a round. Nothing is recorded.
    entitlements:
      path: Config/VictoryAI.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}
        DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
        CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
        REVENUECAT_API_KEY: ${REVENUECAT_API_KEY}
        BACKEND_URL: ${BACKEND_URL}
        WEB_APP_URL: ${WEB_APP_URL}
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          APS_ENVIRONMENT: development
        Release:
          # Manual: CI signs with the distribution cert + profile stored in GitHub secrets.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_PROFILE_NAME}
          APS_ENVIRONMENT: production
