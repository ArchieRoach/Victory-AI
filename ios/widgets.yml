# Live Activities (Lock Screen / Dynamic Island countdowns) live in a widget extension,
# which needs its own App ID and App Store profile. project.yml only includes this file
# when ENABLE_LIVE_ACTIVITIES=true, so builds without that profile still ship.
targets:
  VictoryWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VictoryWidgets
      - path: VictoryAI/Shared/VictoryActivityAttributes.swift
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Victory AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}.widgets
        DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ${WIDGET_PROFILE_NAME}

  VictoryAI:
    dependencies:
      - target: VictoryWidgets
